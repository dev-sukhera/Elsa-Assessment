upstream quiz {
    # Any node can serve any quiz: state lives in Redis. least_conn spreads
    # long-lived WebSockets evenly; no sticky sessions are required.
    least_conn;
    server quiz-a:8000;
    server quiz-b:8000;
}

server {
    listen 80;

    location /ws/ {
        proxy_pass http://quiz;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://quiz;
    }
}
