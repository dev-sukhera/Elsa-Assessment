# Two stateless quiz nodes behind nginx, sharing one Redis.
# Players on different nodes see the same live leaderboard.
#   docker compose up --build   ->  http://localhost:8080
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  quiz-a: &quiz
    build: .
    environment:
      QUIZ_STORE: redis
      QUIZ_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  quiz-b: *quiz

  lb:
    image: nginx:1.27-alpine
    ports: ["${QUIZ_HTTP_PORT:-8080}:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      quiz-a:
        condition: service_healthy
      quiz-b:
        condition: service_healthy
